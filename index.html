 {q:'Who is the Season 4 serial killer known publicly as the Trinity Killer?',a:['Arthur Mitchell','Jordan Chase','Travis Marshall','Isaak Sirko'],c:0},

const state={peer:null,conn:null,peerId:'',status:'waiting',players:{},screen:'',game:{phase:'lobby',index:0,endsAt:0,correct:null,stats:null},me:{username:'',character:'dexter',id:''},answered:false,lastScore:0,joinTimer:null};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function char(id){return characters.find(x=>x.id===id)||characters[0]}

function portraitLoad(){ $$('img[data-actor]').forEach(img=>{if(img.dataset.loaded)return;img.dataset.loaded='1';const title=img.dataset.actor;fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title),{headers:{'Accept':'application/json'}}).then(r=>r.ok?r.json():null).then(d=>{if(d?.thumbnail?.source)img.src=d.thumbnail.source;else img.dispatchEvent(new Event('error'))}).catch(()=>img.dispatchEvent(new Event('error')));});}

function send(type,payload){if(state.conn?.open)state.conn.send({type,payload})}
function hostBroadcast(type,payload){Object.values(state.players).forEach(p=>{if(p.conn?.open)p.conn.send({type,payload})})}

function renderHostLobby(){state.screen='hostLobby';app.innerHTML=`${baseTop()}<section class="hero"><div class="eyebrow">A classified interactive investigation</div><h1>Dexter<span>The Ultimate Quiz Show</span></h1><p>Fifteen cases. One killer’s worth of questions. Join the investigation from your phone.</p></section><section class="dashboard"><article class="card card-pad"><div class="card-heading"><h2>Enter the investigation</h2><span class="label">Secure session · Live</span></div><div class="join-layout"><div class="qr-frame" id="qr"><span class="muted">Generating QR…</span></div><div class="join-info"><div class="label">Scan to join on your phone</div><p class="join-url" id="join-url"></p><div class="divider"></div><div class="label">Session ID</div><div class="peer-code" id="peer-code">Connecting…</div><p class="note">Both devices must be online. For best results, open this page over HTTPS.</p><div id="host-error" class="connection-error"></div></div></div></article><article class="card card-pad"><div class="card-heading"><h2>Investigators on scene</h2><span class="label" id="player-count">0 players</span></div><div class="players" id="players-list"><div class="empty">Waiting for investigators to connect…</div></div><button class="button full" id="start-game" disabled>Start Investigation</button><div class="note" style="margin-top:10px">At least one connected investigator is required.</div></article></section><div class="footer">Evidence logged · Game hosted in this browser · No account required</div>`;hostRenderPlayers();const btn=$('#start-game');btn.onclick=startGame;$('#peer-code').textContent=state.peerId||'Connecting…';const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('join',state.peerId||'');$('#join-url').textContent=url.href;if(state.peerId&&window.QRCode){$('#qr').innerHTML='';new QRCode($('#qr'),{text:url.href,width:142,height:142,colorDark:'#171719',colorLight:'#f5f1ea',correctLevel:QRCode.CorrectLevel.M})}else if(!window.QRCode)$('#qr').innerHTML='<span class="muted">QR library unavailable</span>';}
function hostRenderPlayers(){if(state.screen!=='hostLobby'&&state.screen!=='hostGame'&&state.screen!=='hostFinal')return;const list=$('#players-list');if(!list)return;const arr=Object.values(state.players);$('#player-count').textContent=`${arr.length} player${arr.length===1?'':'s'}`;list.innerHTML=arr.length?arr.map(p=>`<div class="player-row">${avatar(p.character)}<div style="flex:1"><div class="player-name">${esc(p.username)}</div><div class="player-meta">${esc(char(p.character).name)} · ${p.connected?'On scene':'Connection lost'}</div></div><span class="label">${p.connected?'LIVE':'OFFLINE'}</span></div>`).join(''):'<div class="empty">Waiting for investigators to connect…</div>';portraitLoad();const b=$('#start-game');if(b)b.disabled=!arr.some(p=>p.connected)||state.game.phase!=='lobby';}
function startGame(){if(!Object.values(state.players).some(p=>p.connected))return;Object.values(state.players).forEach(p=>{p.score=0;p.correct=0;p.wrong=0;p.answer=null});state.game={phase:'read',index:0,endsAt:Date.now()+10000,correct:null,stats:null};hostStartRead();}
function hostStartRead(){state.game.phase='read';state.game.endsAt=Date.now()+10000;state.game.correct=null;state.game.stats=null;Object.values(state.players).forEach(p=>p.answer=null);state.screen='hostGame';hostBroadcast('game',state.game);hostRenderGame();}
function hostStartAnswer(){state.game.phase='answer';state.game.endsAt=Date.now()+45000;hostBroadcast('game',state.game);hostRenderGame();}
function hostReveal(){const q=questions[state.game.index],players=Object.values(state.players);let right=0,wrong=0;players.forEach(p=>{if(p.answer===q.c){const elapsed=Math.max(0,Math.min(45000,p.answerAt-(state.game.endsAt-45000)));const pts=Math.round(1000*(1-elapsed/45000));p.score+=Math.max(1,pts);p.correct++;p.lastPoints=Math.max(1,pts);right++}else{p.wrong++;p.lastPoints=0;wrong++}});state.game.phase='reveal';state.game.endsAt=Date.now()+10000;state.game.correct=q.c;state.game.stats={right,wrong,players:publicPlayers()};hostBroadcast('reveal',state.game);hostRenderGame();}
function hostNext(){if(state.game.index>=questions.length-1){state.game.phase='final';state.game.endsAt=0;state.screen='hostFinal';hostBroadcast('final',{players:publicPlayers()});renderHostFinal();return}state.game.index++;hostStartRead()}
function hostTimer(){if(state.game.phase==='read'&&Date.now()>=state.game.endsAt)hostStartAnswer();else if(state.game.phase==='answer'&&Date.now()>=state.game.endsAt)hostReveal();else if(state.game.phase==='reveal'&&Date.now()>=state.game.endsAt)hostNext();}
function remaining(){return Math.max(0,Math.ceil((state.game.endsAt-Date.now())/1000))}
function renderHostGame(){state.screen='hostGame';const g=state.game,q=questions[g.index];if(!q)return;let body='';if(g.phase==='read')body=`<div class="read-panel"><div class="read-count" data-count>${remaining()}</div><div class="read-label">Seconds to review the case</div><div class="case-title">${esc(q.q)}</div></div>`;else if(g.phase==='answer')body=`<div class="case-title">${esc(q.q)}</div><div class="answers-grid">${q.a.map((a,i)=>`<div class="answer-card host-answer"><span class="answer-letter">${'ABCD'[i]}</span><span>${esc(a)}</span></div>`).join('')}</div>`;else if(g.phase==='reveal')body=`<div class="case-title">${esc(q.q)}</div><div class="answers-grid">${q.a.map((a,i)=>`<div class="answer-card host-answer ${i===q.c?'correct':''}"><span class="answer-letter">${'ABCD'[i]}</span><span>${esc(a)}${i===q.c?' ✓':''}</span></div>`).join('')}</div><div class="reveal"><div class="reveal-title">Evidence confirmed · Correct answer</div><div class="reveal-answer">${esc(q.a[q.c])}</div><div class="stats-row"><span class="stat-pill"><b>${g.stats?.right||0}</b> correct</span><span class="stat-pill"><b>${g.stats?.wrong||0}</b> incorrect / no answer</span></div></div>`;
 app.innerHTML=`${baseTop()}<section class="question-screen"><div class="game-top"><div><div class="progress">Case ${String(g.index+1).padStart(2,'0')} / 15 · ${g.phase==='read'?'Review the evidence':g.phase==='answer'?'Submit your finding':'Case resolved'}</div><div class="label" style="margin-top:5px">Active investigators: ${Object.values(state.players).filter(p=>p.connected).length}</div></div><div class="timer"><div class="timer-track"><div class="timer-fill" style="width:${g.phase==='read'?remaining()*10:g.phase==='answer'?remaining()/45*100:g.phase==='reveal'?remaining()*10:0}%"></div></div><div class="timer-number" data-timer>${remaining()}</div></div></div><article class="card question-card">${body}</article><div class="card card-pad" style="margin-top:16px"><div class="card-heading"><h2>Suspect ranking</h2><span class="label">Live score · Correct answer up to 1,000 pts</span></div><div class="leaderboard" id="live-board"></div></div></section><div class="footer">Case files are confidential · Answers lock on submission</div>`;hostRenderBoard();}
function orderedPlayers(){return Object.values(state.players).sort((a,b)=>b.score-a.score||a.username.localeCompare(b.username))}
function hostRenderBoard(){const list=$('#live-board');if(!list)return;const players=orderedPlayers();list.innerHTML=players.length?players.map((p,i)=>`<div class="rank-row"><div class="rank-num">${String(i+1).padStart(2,'0')}</div>${avatar(p.character)}<div><div class="player-name">${esc(p.username)}</div><div class="player-meta">${p.connected?'ON SCENE':'CONNECTION LOST'} · ${p.correct} correct</div></div><div class="score">${p.score.toLocaleString()} <span class="label">PTS</span></div></div>`).join(''):'<div class="empty">No players connected.</div>';portraitLoad()}
function renderHostFinal(){state.screen='hostFinal';const p=orderedPlayers(),podium=[p[1],p[0],p[2]].filter(Boolean);app.innerHTML=`${baseTop()}<section class="question-screen"><div class="report"><div class="small-stamp">Miami Metro · Final evidence summary</div><h1 class="report-heading">Investigation closed.</h1><div class="final-summary">15 cases reviewed · ${p.length} investigator${p.length===1?'':'s'} · Final suspect ranking</div>${podium.length?`<div class="podium">${podium.map(x=>`<div class="podium-item ${p[0]===x?'first':''}"><div class="podium-place">#${p.indexOf(x)+1}</div>${avatar(x.character)}<div class="podium-name">${esc(x.username)}</div><div class="score">${x.score.toLocaleString()} pts</div></div>`).join('')}</div>`:''}<div class="divider"></div><div class="card-heading"><h2>Full investigation record</h2><span class="label">Correct / incorrect</span></div><div class="leaderboard">${p.map((x,i)=>`<div class="rank-row"><div class="rank-num">${String(i+1).padStart(2,'0')}</div>${avatar(x.character)}<div><div class="player-name">${esc(x.username)}</div><div class="player-meta">${x.correct} correct · ${x.wrong} incorrect / unanswered</div></div><div class="score">${x.score.toLocaleString()} pts</div></div>`).join('')||'<div class="empty">No investigators participated.</div>'}</div><button class="button" id="again" style="margin-top:20px">Open a new investigation</button></div></section>`;$('#again').onclick=()=>{state.game={phase:'lobby',index:0,endsAt:0};Object.values(state.players).forEach(p=>{p.score=0;p.correct=0;p.wrong=0;p.answer=null});hostBroadcast('game',state.game);renderHostLobby()};portraitLoad()}
function tickHost(){if(state.screen==='hostGame'){hostTimer();const t=$('[data-timer]');if(t)t.textContent=remaining();const c=$('[data-count]');if(c)c.textContent=remaining();const fill=$('.timer-fill');if(fill)fill.style.width=state.game.phase==='read'?remaining()*10+'%':state.game.phase==='answer'?remaining()/45*100+'%':state.game.phase==='reveal'?remaining()*10+'%':'0%';if(state.game.phase==='answer')hostRenderBoard()}}
function renderPhoneJoin(){state.screen='phoneJoin';app.innerHTML=`${baseTop()}<section class="phone-shell"><div class="hero phone-hero"><div class="eyebrow">Miami Metro · Player intake</div><h1>Join the<span>Investigation</span></h1><p>Choose your cover identity and report for duty.</p></div><article class="card card-pad"><div class="card-heading"><h2>Character selection</h2><span class="label">Pick your investigator</span></div><div class="character-grid">${characters.map(c=>`<button class="character ${state.me.character===c.id?'selected':''}" data-char="${c.id}" aria-label="Select ${esc(c.name)}">${avatar(c.id,'')}<div class="char-fallback hidden">${esc(c.initials)}</div><span class="character-name">${esc(c.name)}</span><span class="selection-check">✓</span></button>`).join('')}</div><label class="field-label" for="username">Investigator name</label><input id="username" class="form-control" maxlength="20" autocomplete="nickname" placeholder="Enter a username" value="${esc(state.me.username)}"><button class="button full" id="join-button">Enter the scene</button><div class="note" style="margin-top:12px">Your character and name are locked once the investigation begins.</div><div class="connection-error" id="phone-error"></div></article></section>`;
 // portrait cards use a shared visual fallback when external portrait lookup fails.
 $$('button[data-char]').forEach(b=>b.onclick=()=>{state.me.character=b.dataset.char;$$('.character').forEach(x=>x.classList.toggle('selected',x===b))});const input=$('#username');input.oninput=()=>state.me.username=input.value;$('#join-button').onclick=()=>{const name=input.value.trim();if(name.length<2){toast('Enter a name with at least two characters.');input.focus();return}state.me.username=name;state.me.id=localStorage.getItem('dexter-player-id')||crypto.randomUUID?.()||('p'+Math.random().toString(36).slice(2));localStorage.setItem('dexter-player-id',state.me.id);phoneConnect()};
 // Use Wikipedia's public summaries for actor portraits; preserve consistently sized card crops.
 $$('button[data-char]').forEach(b=>{const c=char(b.dataset.char),img=document.createElement('img');img.className='';img.alt=c.name+' portrait';img.src='';b.insertBefore(img,b.querySelector('.char-fallback'));fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(c.actor),{headers:{Accept:'application/json'}}).then(r=>r.ok?r.json():null).then(d=>{if(d?.thumbnail?.source)img.src=d.thumbnail.source;else img.remove()}).catch(()=>img.remove())});}
function phoneConnect(){if(!window.Peer){$('#phone-error').textContent='PeerJS could not load. Reload the page while online.';return}if(state.peer){try{state.peer.destroy()}catch{}}setStatus('waiting');state.peer=new Peer(undefined,{debug:1});state.peer.on('open',id=>{state.me.localPeer=id;connectToHost()});state.peer.on('connection',()=>{});state.peer.on('disconnected',()=>setStatus('disconnected'));state.peer.on('error',e=>{console.warn(e);setStatus('disconnected');if($('#phone-error'))$('#phone-error').textContent='Connection issue. Check the host is online, then reconnect.'})}
function connectToHost(){if(!targetPeer){toast('The host link is missing its session ID.');return}const conn=state.peer.connect(targetPeer,{reliable:true});state.conn=conn;conn.on('open',()=>{setStatus('connected');conn.send({type:'join',payload:{id:state.me.id,username:state.me.username,character:state.me.character}})});conn.on('data',phoneMessage);conn.on('close',()=>{setStatus('disconnected');if(state.screen==='phoneQuestion')toast('Connection lost. Use Reconnect to rejoin.')});conn.on('error',()=>setStatus('disconnected'));}
function phoneMessage(msg){if(!msg||typeof msg!=='object')return;const {type,payload}=msg;if(type==='welcome'){state.me.id=payload.playerId||state.me.id;if(payload.game)state.game=payload.game;if(state.game.phase==='lobby')renderPhoneLobby();else renderPhoneGame()}else if(type==='players'){state.players=Object.fromEntries((payload||[]).map(p=>[p.id,p]))}else if(type==='game'){state.game=payload;state.answered=false;state.lastScore=0;if(payload.phase==='lobby')renderPhoneLobby();else renderPhoneGame()}else if(type==='reveal'){state.game=payload;const own=payload.stats?.players?.find(p=>p.id===state.me.id);state.lastScore=own?.lastPoints||0;renderPhoneGame()}else if(type==='final'){state.game.phase='final';renderPhoneFinal(payload?.players||[])} }
function reconnect(){if(state.peer?.disconnected){state.peer.reconnect();setTimeout(()=>{if(state.peer?.id)connectToHost()},1000)}else if(state.peer){connectToHost()}else phoneConnect()}
function renderPhoneLobby(){state.screen='phoneLobby';app.innerHTML=`${baseTop()}<section class="phone-shell"><article class="card lobby"><div class="eyebrow">Investigation briefing</div>${avatar(state.me.character)}<h2 class="lobby-name">${esc(state.me.username||'Investigator')}</h2><div class="label">${esc(char(state.me.character).name)}</div><div class="divider"></div><p class="pulse">You are on the scene. Waiting for the host to open the first case…</p><div class="note">Keep this screen open. Your character is now locked.</div><button class="button secondary small" id="reconnect">Reconnect</button></article></section>`;$('#reconnect').onclick=reconnect;portraitLoad()}
function answerPhone(i){if(state.answered||state.game.phase!=='answer')return;state.answered=true;send('answer',{id:state.me.id,choice:i});$$('.phone-option').forEach((b,j)=>{b.disabled=true;b.classList.toggle('selected',i===j)});const msg=$('#answer-message');if(msg)msg.textContent='Finding submitted. Your answer is locked.'}
function renderPhoneGame(){const g=state.game,q=questions[g.index];if(!q){renderPhoneLobby();return}state.screen='phoneQuestion';const read=g.phase==='read',answer=g.phase==='answer',reveal=g.phase==='reveal';let content='';if(read)content=`<div class="read-panel"><div class="read-count" data-phone-count>${remaining()}</div><div class="read-label">Read the case · Answers unlock when the timer ends</div><div class="phone-question">${esc(q.q)}</div></div>`;if(answer)content=`<div class="phone-question">${esc(q.q)}</div><div class="phone-options">${q.a.map((a,i)=>`<button class="phone-option" data-choice="${i}" ${state.answered?'disabled':''}><span class="answer-letter">${'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div><p class="note" id="answer-message" style="text-align:center;margin-top:15px">${state.answered?'Finding submitted. Your answer is locked.':'Choose one evidence card. You cannot change your answer.'}</p>`;if(reveal){const correct=g.correct,own=g.stats?.players?.find(p=>p.id===state.me.id),wasRight=own?.answer===correct;content=`<div class="phone-question">${esc(q.q)}</div><div class="reveal"><div class="reveal-title">${wasRight?'Evidence confirmed':'Finding not confirmed'}</div><div class="reveal-answer">${esc(q.a[correct])}</div><div class="phone-feedback"><div>${wasRight?'Correct answer':'The correct finding was'} · ${own?.answer==null?'No answer submitted':wasRight?'You got it right':'Your answer was incorrect'}</div><div class="points">+${own?.lastPoints||0} pts</div><div class="note">Total score: ${(own?.score||0).toLocaleString()} points</div></div><div class="stats-row" style="justify-content:center"><span class="stat-pill"><b>${g.stats?.right||0}</b> correct</span><span class="stat-pill"><b>${g.stats?.wrong||0}</b> incorrect / unanswered</span></div></div>`}
app.innerHTML=`${baseTop()}<section class="phone-shell"><div class="game-top"><div class="progress">Case ${String(g.index+1).padStart(2,'0')} / 15</div><div class="timer"><div class="timer-track"><div class="timer-fill" style="width:${read?remaining()*10:answer?remaining()/45*100:remaining()*10}%"></div></div><div class="timer-number" data-phone-timer>${remaining()}</div></div></div><article class="card card-pad"><div class="small-stamp">Evidence file · DPD-${String(g.index+1).padStart(4,'0')}</div>${content}</article><div style="text-align:center;margin-top:12px"><button class="button secondary small" id="reconnect">Reconnect</button></div></section>`;if(answer)$$('[data-choice]').forEach(b=>b.onclick=()=>answerPhone(Number(b.dataset.choice)));$('#reconnect').onclick=reconnect;}
function renderPhoneFinal(players){state.screen='phoneFinal';const sorted=[...players].sort((a,b)=>b.score-a.score||a.username.localeCompare(b.username));const index=sorted.findIndex(p=>p.id===state.me.id),me=sorted[index];app.innerHTML=`${baseTop()}<section class="phone-shell"><article class="card report"><div class="small-stamp">Miami Metro · Final report</div><h1 class="report-heading">Case closed.</h1><div class="phone-feedback"><div class="label">${me?'Final placement':'Investigation complete'}</div><div class="points">${me?'#'+(index+1):'—'}</div><div class="lobby-name">${esc(me?.username||state.me.username)}</div><div class="score">${(me?.score||0).toLocaleString()} points</div><div class="note">${me?.correct||0} correct · ${me?.wrong||0} incorrect / unanswered</div></div><div class="divider"></div><div class="leaderboard">${sorted.map((p,i)=>`<div class="rank-row"><div class="rank-num">${String(i+1).padStart(2,'0')}</div>${avatar(p.character)}<div class="player-name">${esc(p.username)}</div><div class="score">${p.score.toLocaleString()}</div></div>`).join('')}</div></article></section>`;portraitLoad()}
function tickPhone(){if(state.screen!=='phoneQuestion')return;const t=$('[data-phone-timer]');if(t)t.textContent=remaining();const c=$('[data-phone-count]');if(c)c.textContent=remaining();const fill=$('.timer-fill');if(fill)fill.style.width=state.game.phase==='read'?remaining()*10+'%':state.game.phase==='answer'?remaining()/45*100+'%':remaining()*10+'%'}
if(joining)renderPhoneJoin();else{renderHostLobby();hostConnect()}
setInterval(()=>joining?tickPhone():tickHost(),250);
})();
</script></body></html>
